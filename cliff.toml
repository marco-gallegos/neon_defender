# git-cliff configuration for neon_defender (galaxy-defendor-neon-dash)
# Generate/refresh the changelog with:  npm run changelog
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# Header rendered at the top of CHANGELOG.md
header = """
# Changelog

All notable changes to **Neon Defender** (galaxy-defendor-neon-dash) are documented here.

This file is generated from the git history with [git-cliff](https://git-cliff.org).
Format loosely follows [Keep a Changelog](https://keepachangelog.com/) and
[Conventional Commits](https://www.conventionalcommits.org/).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }})){% endif %}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}\
    {%- endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Parse Conventional Commits (feat, fix, chore, docs, ...)
conventional_commits = true
# Be forgiving: keep non-conventional commits instead of dropping them
filter_unconventional = false
# Split commits on blank lines when enriching the body
split_commits = false
# Accept both "feat: x" and "feat(scope): x"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build System" },
  { message = "^ci", group = "Continuous Integration" },
  { message = "^chore\\(release\\)", group = "Release", skip = true },
  { message = "^chore", group = "Chores" },
  { message = "^revert", group = "Reverted" },
  { message = ".*", group = "Other Changes" },
]
# Protect lines starting with these from being treated as footers
protect_breaking_commits = false
# Filter out merge commits
filter_commits = true
# Match tags like v1.0.0 or 1.0.0
tag_pattern = "v[0-9].*"
# Sort tags by semantic version
sort_commits = "oldest"
# Link issue/PR references to GitHub
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/marco-gallegos/neon_defender/issues/$1" },
]

# Repository remote (used for PR/author links in the template)
[remote.github]
owner = "marco-gallegos"
repo = "neon_defender"
